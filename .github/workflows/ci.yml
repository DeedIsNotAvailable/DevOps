name: CI

on:
  push:
    branches: [main, feat/terraform-infra]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check Terraform formatting, validate and plan against Floci
        run: make ci
